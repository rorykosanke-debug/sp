          cat > app/src/main/java/com/rorykosanke/vdub/AudioMuxer.kt <<'EOF_20'
          package com.rorykosanke.vdub

          import android.content.ContentValues
          import android.content.Context
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import java.io.File
          import java.io.FileDescriptor
          import java.io.FileOutputStream
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          /**
           * 把新的中文音轨编码成 AAC，并和原视频轨一起封进新 MP4。
           */
          class AudioMuxer {

              private data class AacSample(val data: ByteArray, val pts: Long, val flags: Int)

              private class OutputTarget(
                  val fd: FileDescriptor,
                  val uri: Uri,
                  val path: String,
                  val close: () -> Unit
              )

              /** @return (结果 Uri, 可读路径) */
              fun mux(context: Context, videoUri: Uri, pcm: FloatArray, rate: Int): Pair<Uri, String> {
                  // 1. 音频编码为 AAC
                  val enc = encodeAac(pcm, rate)
                  val aacFormat = enc.first
                  val aacSamples = enc.second

                  // 2. 读取源视频轨
                  val extractor = MediaExtractor()
                  extractor.setDataSource(context, videoUri, null)
                  var videoTrack = -1
                  var videoFormat: MediaFormat? = null
                  for (i in 0 until extractor.trackCount) {
                      val f = extractor.getTrackFormat(i)
                      val mime = f.getString(MediaFormat.KEY_MIME) ?: ""
                      if (mime.startsWith("video/")) {
                          videoTrack = i; videoFormat = f; break
                      }
                  }
                  if (videoTrack < 0 || videoFormat == null) {
                      extractor.release()
                      throw RuntimeException("源文件里没有视频轨")
                  }
                  extractor.selectTrack(videoTrack)

                  // 3. 建输出
                  val target = createOutput(context)
                  val muxer = MediaMuxer(target.fd, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)
                  val vTrack = muxer.addTrack(videoFormat)
                  val aTrack = muxer.addTrack(aacFormat)
                  muxer.start()

                  // 4. 写入视频帧
                  val maxBuf = 4 * 1024 * 1024
                  val buffer = ByteBuffer.allocateDirect(maxBuf)
                  val info = MediaCodec.BufferInfo()
                  while (true) {
                      buffer.clear()
                      val sz = extractor.readSampleData(buffer, 0)
                      if (sz < 0) break
                      info.offset = 0
                      info.size = sz
                      info.presentationTimeUs = extractor.sampleTime
                      info.flags = if (extractor.sampleFlags and MediaExtractor.SAMPLE_FLAG_SYNC != 0)
                          MediaCodec.BUFFER_FLAG_KEY_FRAME else 0
                      muxer.writeSampleData(vTrack, buffer, info)
                      extractor.advance()
                  }
                  extractor.release()

                  // 5. 写入音频帧
                  for (s in aacSamples) {
                      info.offset = 0
                      info.size = s.data.size
                      info.presentationTimeUs = s.pts
                      info.flags = s.flags
                      muxer.writeSampleData(aTrack, ByteBuffer.wrap(s.data), info)
                  }

                  muxer.stop()
                  muxer.release()
                  target.close()
                  return Pair(target.uri, target.path)
              }

              private fun createOutput(context: Context): OutputTarget {
                  val name = "dubbed_${System.currentTimeMillis()}.mp4"
                  if (Build.VERSION.SDK_INT >= 29) {
                      val values = ContentValues().apply {
                          put(MediaStore.Video.Media.DISPLAY_NAME, name)
                          put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                          put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/视频转配音")
                      }
                      val collection = MediaStore.Video.Media.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      val uri = context.contentResolver.insert(collection, values)
                          ?: throw RuntimeException("无法创建输出文件")
                      val pfd = context.contentResolver.openFileDescriptor(uri, "w")
                          ?: throw RuntimeException("无法打开输出文件")
                      return OutputTarget(pfd.fileDescriptor, uri, "Movies/视频转配音/$name") { pfd.close() }
                  } else {
                      val dir = File(context.getExternalFilesDir(null), "Vidub")
                      if (!dir.exists()) dir.mkdirs()
                      val f = File(dir, name)
                      val fos = FileOutputStream(f)
                      return OutputTarget(fos.fd, Uri.fromFile(f), f.absolutePath) { fos.close() }
                  }
              }

              private fun encodeAac(pcm: FloatArray, rate: Int): Pair<MediaFormat, List<AacSample>> {
                  val format = MediaFormat.createAudioFormat(MediaFormat.MIMETYPE_AUDIO_AAC, rate, 1).apply {
                      setInteger(MediaFormat.KEY_AAC_PROFILE, MediaCodecInfo.CodecProfileLevel.AACObjectLC)
                      setInteger(MediaFormat.KEY_BIT_RATE, 96000)
                      setInteger(MediaFormat.KEY_MAX_INPUT_SIZE, 16384)
                  }
                  val codec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_AUDIO_AAC)
                  codec.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                  codec.start()

                  val samples = ArrayList<AacSample>()
                  val outInfo = MediaCodec.BufferInfo()
                  var outFormat: MediaFormat? = null

                  val totalFrames = pcm.size
                  var framePos = 0
                  var inputDone = false
                  var outputDone = false
                  val bytesPerFrame = 2

                  while (!outputDone) {
                      if (!inputDone) {
                          val inIdx = codec.dequeueInputBuffer(10000)
                          if (inIdx >= 0) {
                              val ib = codec.getInputBuffer(inIdx)!!
                              ib.clear()
                              val capacityFrames = ib.capacity() / bytesPerFrame
                              if (framePos >= totalFrames) {
                                  codec.queueInputBuffer(inIdx, 0, 0,
                                      framePos * 1_000_000L / rate, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                  inputDone = true
                              } else {
                                  val framesToWrite = minOf(capacityFrames, totalFrames - framePos)
                                  val sb = ib.order(ByteOrder.LITTLE_ENDIAN).asShortBuffer()
                                  for (i in 0 until framesToWrite) {
                                      val v = (pcm[framePos + i] * 32767f).toInt().coerceIn(-32768, 32767).toShort()
                                      sb.put(v)
                                  }
                                  val pts = framePos * 1_000_000L / rate
                                  codec.queueInputBuffer(inIdx, 0, framesToWrite * bytesPerFrame, pts, 0)
                                  framePos += framesToWrite
                              }
                          }
                      }

                      val outIdx = codec.dequeueOutputBuffer(outInfo, 10000)
                      if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          outFormat = codec.outputFormat
                      } else if (outIdx >= 0) {
                          val ob = codec.getOutputBuffer(outIdx)!!
                          if (outInfo.size > 0) {
                              val data = ByteArray(outInfo.size)
                              ob.position(outInfo.offset)
                              ob.limit(outInfo.offset + outInfo.size)
                              ob.get(data)
                              samples.add(AacSample(data, outInfo.presentationTimeUs, outInfo.flags))
                          }
                          codec.releaseOutputBuffer(outIdx, false)
                          if (outInfo.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) outputDone = true
                      }
                  }

                  codec.stop()
                  codec.release()
                  if (outFormat == null) throw RuntimeException("音频编码失败")
                  return Pair(outFormat, samples)
              }
          }
