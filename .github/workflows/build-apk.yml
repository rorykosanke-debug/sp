      - name: Clone whisper.cpp
        run: |
          cd app/src/main/cpp
          git clone --depth 1 --recurse-submodules --branch v1.7.4 https://github.com/ggerganov/whisper.cpp whisper.cpp || (rm -rf whisper.cpp && git clone --depth 1 --recurse-submodules https://github.com/ggerganov/whisper.cpp whisper.cpp)
          echo "whisper.cpp cloned:"
          ls whisper.cpp | head

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK (release, debug-signed)
        run: |
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vidub-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vdub-${{ github.run_number }}
          name: Vidub 中文配音 build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
