              private lateinit var statusText: TextView
              private lateinit var progressBar: ProgressBar
              private lateinit var startBtn: Button
              private lateinit var openBtn: Button
              private lateinit var modelGroup: RadioGroup

              private val REQ_PICK = 1001

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(android.view.WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)

                  pathText = findViewById(R.id.pathText)
                  keyEdit = findViewById(R.id.keyEdit)
                  statusText = findViewById(R.id.statusText)
                  progressBar = findViewById(R.id.progressBar)
                  startBtn = findViewById(R.id.startBtn)
                  openBtn = findViewById(R.id.openBtn)
                  modelGroup = findViewById(R.id.modelGroup)

                  val prefs = getSharedPreferences("vdub", MODE_PRIVATE)
                  keyEdit.setText(prefs.getString("key", ""))
                  openBtn.visibility = View.GONE

                  findViewById<Button>(R.id.pickBtn).setOnClickListener {
                      val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                          addCategory(Intent.CATEGORY_OPENABLE)
                          type = "video/*"
                          addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      }
                      startActivityForResult(intent, REQ_PICK)
                  }

                  startBtn.setOnClickListener { startDub(prefs) }

                  openBtn.setOnClickListener {
                      resultUri?.let { u ->
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(u, "video/mp4")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                              })
                          } catch (e: Exception) {
                              toast("无法打开播放器：${e.message}")
                          }
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_PICK && resultCode == RESULT_OK) {
                      data?.data?.let {
                          videoUri = it
                          try {
                              contentResolver.takePersistableUriPermission(it, Intent.FLAG_GRANT_READ_URI_PERMISSION)
                          } catch (_: Exception) {
                          }
                          pathText.text = "已选视频：" + (it.lastPathSegment ?: it.toString())
                      }
                  }
              }

              private fun startDub(prefs: android.content.SharedPreferences) {
                  val uri = videoUri ?: run { toast("请先选择视频"); return }
                  val key = keyEdit.text.toString().trim()
                  if (key.isEmpty()) { toast("请填写 DeepSeek API Key"); return }
                  prefs.edit().putString("key", key).apply()

                  val tiny = modelGroup.checkedRadioButtonId == R.id.radioTiny
                  startBtn.isEnabled = false
                  openBtn.visibility = View.GONE
                  progressBar.visibility = View.VISIBLE
                  progressBar.progress = 0
                  statusText.text = "准备中…"

                  DubPipeline(this).run(uri, key, tiny, object : DubPipeline.Callback {
                      override fun onProgress(pct: Int, msg: String) {
                          runOnUiThread {
                              progressBar.progress = pct
                              statusText.text = "$msg ($pct%)"
                          }
                      }

                      override fun onDone(uri: Uri, savedPath: String) {
                          runOnUiThread {
                              startBtn.isEnabled = true
                              progressBar.visibility = View.GONE
                              resultUri = uri
                              statusText.text = "完成！\n已保存：$savedPath"
                              openBtn.visibility = View.VISIBLE
                          }
                      }

                      override fun onError(msg: String) {
                          runOnUiThread {
                              startBtn.isEnabled = true
                              progressBar.visibility = View.GONE
                              statusText.text = "出错：$msg"
                          }
                      }
                  })
              }

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()
          }
