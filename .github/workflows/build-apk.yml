          cat > app/src/main/cpp/whisper_jni.cpp <<'EOF_10'
          #include <jni.h>
          #include <string>
          #include "whisper.h"

          extern "C" {

          JNIEXPORT jlong JNICALL
          Java_com_rorykosanke_vdub_WhisperLib_nativeInit(JNIEnv *env, jobject /*thiz*/, jstring modelPath) {
              const char *path = env->GetStringUTFChars(modelPath, nullptr);
              whisper_context_params cparams = whisper_context_default_params();
              whisper_context *ctx = whisper_init_from_file_with_params(path, cparams);
              env->ReleaseStringUTFChars(modelPath, path);
              return (jlong) ctx;
          }

          JNIEXPORT jobjectArray JNICALL
          Java_com_rorykosanke_vdub_WhisperLib_nativeTranscribe(JNIEnv *env, jobject /*thiz*/,
                                                                jlong ptr, jfloatArray samples) {
              whisper_context *ctx = (whisper_context *) ptr;
              if (ctx == nullptr) return nullptr;

              jsize n = env->GetArrayLength(samples);
              jfloat *data = env->GetFloatArrayElements(samples, nullptr);

              whisper_full_params params = whisper_full_default_params(WHISPER_SAMPLING_GREEDY);
              params.print_realtime   = false;
              params.print_progress   = false;
              params.print_timestamps = false;
              params.print_special    = false;
              params.translate        = false;
              params.language         = "en";
              params.n_threads        = 4;
              params.no_context       = true;
              params.single_segment   = false;
              params.offset_ms        = 0;
              params.duration_ms      = 0;

              int ret = whisper_full(ctx, params, data, n);
              env->ReleaseFloatArrayElements(samples, data, JNI_ABORT);

              if (ret != 0) return nullptr;

              int nseg = whisper_full_n_segments(ctx);
              jclass strCls = env->FindClass("java/lang/String");
              jobjectArray out = env->NewObjectArray(nseg, strCls, nullptr);

              for (int i = 0; i < nseg; i++) {
                  const char *text = whisper_full_get_segment_text(ctx, i);
                  long t0 = (long) whisper_full_get_segment_t0(ctx, i) * 10; // 10ms units -> ms
                  long t1 = (long) whisper_full_get_segment_t1(ctx, i) * 10;
                  std::string s = std::to_string(t0) + "|" + std::to_string(t1) + "|" + std::string(text);
                  jstring js = env->NewStringUTF(s.c_str());
                  env->SetObjectArrayElement(out, i, js);
                  env->DeleteLocalRef(js);
              }
              return out;
          }

          JNIEXPORT void JNICALL
          Java_com_rorykosanke_vdub_WhisperLib_nativeFree(JNIEnv * /*env*/, jobject /*thiz*/, jlong ptr) {
              whisper_free((whisper_context *) ptr);
          }

          }
          EOF_10

          cat > app/src/main/java/com/rorykosanke/vdub/FloatList.kt <<'EOF_11'
          package com.rorykosanke.vdub

          /** 可增长的 float 数组，避免用装箱集合带来的内存/性能开销 */
          class FloatList(cap: Int = 1 shl 16) {
              var arr = FloatArray(cap)
                  private set
              var size = 0
                  private set

              fun add(v: Float) {
                  if (size == arr.size) arr = arr.copyOf(arr.size * 2)
                  arr[size++] = v
              }

              fun toArray(): FloatArray = arr.copyOf(size)
          }
          EOF_11

          cat > app/src/main/java/com/rorykosanke/vdub/StreamingResampler.kt <<'EOF_12'
          package com.rorykosanke.vdub

          /** 流式线性重采样，可在音频分块解码时逐块处理，避免一次性占用大量内存 */
          class StreamingResampler(private val srcRate: Int, private val dstRate: Int) {
              private val step = srcRate.toDouble() / dstRate
              private var carry = FloatArray(0)
              private var pos = 0.0

              fun process(input: FloatArray, out: FloatList) {
                  if (input.isEmpty()) return
                  val combined: FloatArray = if (carry.isEmpty()) {
                      input
                  } else {
                      val c = FloatArray(carry.size + input.size)
                      System.arraycopy(carry, 0, c, 0, carry.size)
                      System.arraycopy(input, 0, c, carry.size, input.size)
                      c
                  }
                  if (combined.size < 2) {
                      carry = combined.copyOf()
                      return
                  }
                  var i = pos
                  val lastIndex = combined.size - 1
                  while (i < lastIndex) {
                      val i0 = i.toInt()
                      val frac = (i - i0).toFloat()
                      out.add(combined[i0] * (1 - frac) + combined[i0 + 1] * frac)
                      i += step
                  }
                  // 下一轮从最后一个样本继续
                  pos = i - lastIndex
                  carry = floatArrayOf(combined[lastIndex])
              }
          }
          EOF_12

          cat > app/src/main/java/com/rorykosanke/vdub/AudioDecoder.kt <<'EOF_13'
          package com.rorykosanke.vdub

          import android.content.Context
          import android.media.MediaCodec
          import android.media.MediaExtractor
          import android.media.MediaFormat
          import android.net.Uri
          import java.io.File
          import java.nio.ByteOrder

          /**
           * 从视频/音频里解出声音，混为单声道并重采样到 16kHz（Whisper 需要 16k 单声道 float）
           * decodeToMono16k 用于视频，decodeFileToMono16k 用于任意音频文件（如在线TTS下载的 mp3）
           */
          class AudioDecoder {

              fun decodeToMono16k(context: Context, uri: Uri): FloatArray {
                  val ex = MediaExtractor()
                  ex.setDataSource(context, uri, null)
                  return try { decodeCore(ex) } finally { ex.release() }
              }

              fun decodeFileToMono16k(file: File): FloatArray {
                  val ex = MediaExtractor()
                  ex.setDataSource(file.absolutePath)
                  return try { decodeCore(ex) } finally { ex.release() }
              }

              private fun decodeCore(extractor: MediaExtractor): FloatArray {
                  var audioTrack = -1
                  var fmt: MediaFormat? = null
                  for (i in 0 until extractor.trackCount) {
                      val f = extractor.getTrackFormat(i)
                      val mime = f.getString(MediaFormat.KEY_MIME) ?: ""
                      if (mime.startsWith("audio/")) { audioTrack = i; fmt = f; break }
                  }
                  if (audioTrack < 0 || fmt == null) return FloatArray(0)
                  extractor.selectTrack(audioTrack)

                  val mime = fmt.getString(MediaFormat.KEY_MIME)!!
                  var srcRate = try { fmt.getInteger(MediaFormat.KEY_SAMPLE_RATE) } catch (e: Exception) { 44100 }
                  var srcCh = try { fmt.getInteger(MediaFormat.KEY_CHANNEL_COUNT) } catch (e: Exception) { 2 }
                  if (srcRate <= 0) srcRate = 44100
                  if (srcCh < 1) srcCh = 1

                  val codec = MediaCodec.createDecoderByType(mime)
                  codec.configure(fmt, null, null, 0)
                  codec.start()

                  val outFloats = FloatList()
                  val resampler = StreamingResampler(srcRate, 16000)
                  val info = MediaCodec.BufferInfo()
                  var eosInput = false
                  var eosOutput = false

                  while (!eosOutput) {
                      if (!eosInput) {
                          val inIdx = codec.dequeueInputBuffer(10000)
                          if (inIdx >= 0) {
                              val buf = codec.getInputBuffer(inIdx)!!
                              val sz = extractor.readSampleData(buf, 0)
                              if (sz < 0) {
                                  codec.queueInputBuffer(inIdx, 0, 0, 0, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                                  eosInput = true
                              } else {
                                  codec.queueInputBuffer(inIdx, 0, sz, extractor.sampleTime, 0)
                                  extractor.advance()
                              }
                          }
                      }

                      val outIdx = codec.dequeueOutputBuffer(info, 10000)
                      if (outIdx >= 0) {
                          val buf = codec.getOutputBuffer(outIdx)!!
                          buf.position(info.offset)
                          buf.limit(info.offset + info.size)
                          val shorts = buf.order(ByteOrder.nativeOrder()).asShortBuffer()
                          val totalShorts = shorts.remaining()
                          val frames = totalShorts / srcCh
                          val chFloats = FloatArray(frames)
                          for (f in 0 until frames) {
                              var sum = 0f
                              for (c in 0 until srcCh) {
                                  if (shorts.hasRemaining()) sum += shorts.get() / 32768f
                              }
                              chFloats[f] = sum / srcCh
                          }
                          resampler.process(chFloats, outFloats)
                          codec.releaseOutputBuffer(outIdx, false)
                          if (info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM != 0) eosOutput = true
                      }
                  }

                  codec.stop(); codec.release()
                  return outFloats.toArray()
              }
          }
          EOF_13

          cat > app/src/main/java/com/rorykosanke/vdub/WhisperLib.kt <<'EOF_14'
          package com.rorykosanke.vdub

          /** Whisper 的 JNI 封装 */
          class WhisperLib {

              companion object {
                  init {
                      System.loadLibrary("whisper_jni")
                  }
              }

              data class Seg(val startMs: Long, val endMs: Long, val text: String)

              private external fun nativeInit(path: String): Long
              private external fun nativeTranscribe(ptr: Long, samples: FloatArray): Array<String>?
              private external fun nativeFree(ptr: Long)

              fun init(modelPath: String): Long = nativeInit(modelPath)

              fun free(ptr: Long) {
                  if (ptr != 0L) nativeFree(ptr)
              }

              fun transcribe(ptr: Long, samples: FloatArray): List<Seg> {
                  val raw = nativeTranscribe(ptr, samples) ?: return emptyList()
                  val out = ArrayList<Seg>(raw.size)
                  for (s in raw) {
                      val parts = s.split("|", limit = 3)
                      if (parts.size < 3) continue
                      val t0 = parts[0].toLongOrNull() ?: 0L
                      val t1 = parts[1].toLongOrNull() ?: 0L
                      val text = parts[2].trim()
                      if (text.isEmpty()) continue
                      out.add(Seg(t0, t1, text))
                  }
                  return out
              }
          }
          EOF_14

          cat > app/src/main/java/com/rorykosanke/vdub/ModelDownloader.kt <<'EOF_15'
          package com.rorykosanke.vdub

          import android.content.Context
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL

          /** 首次运行时下载 ggml 模型到 App 私有目录 */
          class ModelDownloader(private val context: Context) {

              fun ensureModel(tiny: Boolean, progress: (Int, String) -> Unit): File {
                  val name = if (tiny) "ggml-tiny.en.bin" else "ggml-base.en.bin"
                  val dir = File(context.filesDir, "models")
                  if (!dir.exists()) dir.mkdirs()
                  val f = File(dir, name)
                  if (f.exists() && f.length() > 1_000_000L) return f

                  val url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$name"
                  progress(2, "下载识别模型 $name (首次需要)…")
                  val tmp = File(dir, "$name.part")
                  if (tmp.exists()) tmp.delete()

                  val conn = URL(url).openConnection() as HttpURLConnection
                  conn.connectTimeout = 20000
                  conn.readTimeout = 60000
                  conn.instanceFollowRedirects = true
                  conn.requestMethod = "GET"
                  conn.connect()

                  val total = conn.contentLengthLong
                  conn.inputStream.use { input ->
                      tmp.outputStream().use { output ->
                          val buf = ByteArray(1 shl 16)
                          var done = 0L
                          var lastPct = -1
                          while (true) {
                              val read = input.read(buf)
                              if (read < 0) break
                              output.write(buf, 0, read)
                              done += read
                              if (total > 0) {
                                  val pct = (done * 8 / total).toInt() // 0~8%
                                  if (pct != lastPct) {
                                      lastPct = pct
                                      progress(2 + pct, "下载模型 ${done / 1048576}MB / ${total / 1048576}MB")
                                  }
                              }
                          }
                      }
                  }
                  conn.disconnect()
                  if (f.exists()) f.delete()
                  tmp.renameTo(f)
                  if (!f.exists() || f.length() < 1_000_000L) {
                      throw RuntimeException("模型下载失败，请检查网络后重试")
                  }
                  return f
              }
          }
          EOF_15

          cat > app/src/main/java/com/rorykosanke/vdub/Translator.kt <<'EOF_16'
          package com.rorykosanke.vdub

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /** 调用 DeepSeek 把英文逐句翻成中文，分批请求以降低时延和失败率 */
          class Translator(private val apiKey: String) {

              fun translateSegments(segments: List<String>, progress: (Int) -> Unit): List<String> {
                  val out = ArrayList<String>(segments.size)
                  if (segments.isEmpty()) return out
                  val batchSize = 16
                  var idx = 0
                  while (idx < segments.size) {
                      val end = minOf(idx + batchSize, segments.size)
                      val batch = segments.subList(idx, end)
                      val translated = try {
                          translateBatch(batch)
                      } catch (e: Exception) {
                          // 该批失败就整批留空（后续该句不做配音），不中断整体
                          batch.map { "" }
                      }
                      out.addAll(translated)
                      idx = end
                      progress(idx * 100 / segments.size)
                  }
                  return out
              }

              private fun translateBatch(batch: List<String>): List<String> {
                  val arr = JSONArray()
                  for (s in batch) arr.put(s)

                  val sys = "You are a professional subtitle translator. Translate each English line into natural, " +
                          "concise SPOKEN Chinese (Simplified), suitable for dubbing. Keep the same number of items and " +
                          "the same order. Do not merge or split items. Output ONLY a JSON object: " +
                          "{\"t\":[\"zh1\",\"zh2\",...]} with exactly ${batch.size} strings. No explanations."

                  val body = JSONObject().apply {
                      put("model", "deepseek-chat")
                      put("temperature", 0.2)
                      put("stream", false)
                      put("messages", JSONArray().apply {
                          put(JSONObject().put("role", "system").put("content", sys))
                          put(JSONObject().put("role", "user").put("content", "Translate these ${batch.size} lines:\n" + arr.toString()))
                      })
                  }.toString()

                  val conn = URL("https://api.deepseek.com/chat/completions").openConnection() as HttpURLConnection
                  conn.requestMethod = "POST"
                  conn.connectTimeout = 30000
                  conn.readTimeout = 120000
                  conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                  conn.setRequestProperty("Authorization", "Bearer $apiKey")
                  conn.doOutput = true
                  conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }

                  val code = conn.responseCode
                  val text = if (code in 200..299) {
                      conn.inputStream.bufferedReader(Charsets.UTF_8).readText()
                  } else {
                      conn.errorStream?.bufferedReader(Charsets.UTF_8)?.readText() ?: ""
                  }
                  if (code !in 200..299) {
                      throw RuntimeException("翻译接口错误 $code: ${text.take(200)}")
                  }

                  val resp = JSONObject(text)
                  val content = resp.getJSONArray("choices").getJSONObject(0)
                      .getJSONObject("message").getString("content")

                  val jsonStart = content.indexOf('{')
                  val jsonEnd = content.lastIndexOf('}')
                  val jsonStr = if (jsonStart >= 0 && jsonEnd > jsonStart) content.substring(jsonStart, jsonEnd + 1) else content

                  val t = JSONObject(jsonStr).getJSONArray("t")
                  val list = ArrayList<String>(t.length())
                  for (i in 0 until t.length()) list.add(t.getString(i))
                  while (list.size < batch.size) list.add("")
                  return list.subList(0, batch.size)
              }
          }
