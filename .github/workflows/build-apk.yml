          cat > app/src/main/java/com/rorykosanke/vdub/DubPipeline.kt <<'EOF_21'
          package com.rorykosanke.vdub

          import android.content.Context
          import android.net.Uri
          import kotlin.concurrent.thread

          /**
           * 整条流水线：识别 → 翻译 → 合成 → 对齐 → 合成视频
           */
          class DubPipeline(private val context: Context) {

              interface Callback {
                  fun onProgress(pct: Int, msg: String)
                  fun onDone(uri: Uri, savedPath: String)
                  fun onError(msg: String)
              }

              data class Clip(val startMs: Long, val endMs: Long, val samples: FloatArray, val rate: Int)

              fun run(videoUri: Uri, apiKey: String, tiny: Boolean, cb: Callback) {
                  thread {
                      try {
                          // 1. 模型
                          cb.onProgress(2, "检查识别模型…")
                          val modelFile = ModelDownloader(context).ensureModel(tiny) { p, m -> cb.onProgress(p, m) }

                          // 2. 解码音频
                          cb.onProgress(10, "解码视频音频…")
                          val pcm16k = AudioDecoder().decodeToMono16k(context, videoUri)
                          if (pcm16k.isEmpty()) throw RuntimeException("没读到音频，确认视频里有声音")
                          val durationMs = pcm16k.size * 1000L / 16000L

                          // 3. 识别
                          cb.onProgress(20, "语音识别中(可能需要几分钟，请耐心等)…")
                          val whisper = WhisperLib()
                          val ctxPtr = whisper.init(modelFile.absolutePath)
                          if (ctxPtr == 0L) throw RuntimeException("模型加载失败")
                          val segs = try {
                              whisper.transcribe(ctxPtr, pcm16k)
                          } finally {
                              whisper.free(ctxPtr)
                          }
                          if (segs.isEmpty()) throw RuntimeException("没有识别到语音")
                          cb.onProgress(45, "识别到 ${segs.size} 句，开始翻译…")

                          // 4. 翻译
                          val translator = Translator(apiKey)
                          val translated = translator.translateSegments(segs.map { it.text }) { p ->
                              cb.onProgress(45 + p * 20 / 100, "翻译中… $p%")
                          }

                          // 5. TTS
                          cb.onProgress(68, "合成中文语音…")
                          val tts = TtsSynth(context)
                          tts.init()
                          val clips = ArrayList<Clip>()
                          try {
                              for (i in segs.indices) {
                                  val seg = segs[i]
                                  val zh = translated.getOrNull(i)?.trim().orEmpty()
                                  if (zh.isNotEmpty()) {
                                      val clip = tts.synthesize(zh)
                                      if (clip != null && clip.first.isNotEmpty()) {
                                          clips.add(Clip(seg.startMs, seg.endMs, clip.first, clip.second))
                                      }
                                  }
                                  cb.onProgress(68 + (i + 1) * 12 / segs.size, "合成中文语音… ${i + 1}/${segs.size}")
                              }
                          } finally {
                              tts.release()
                          }
                          if (clips.isEmpty()) throw RuntimeException("中文语音合成全部失败：系统无中文语音，且在线语音也没成功（离线${tts.localCount}句/在线${tts.onlineCount}句）。请检查网络后重试，或安装一个中文TTS引擎。")

                          // 6. 对齐时间轴
                          cb.onProgress(82, "按时间轴对齐中文语音…")
                          val outRate = 44100
                          val timeline = buildTimeline(clips, durationMs, outRate)

                          // 释放大块内存
                          System.gc()

                          // 7. 合成视频
                          cb.onProgress(88, "合成视频(编码音频+合并)…")
                          val result = AudioMuxer().mux(context, videoUri, timeline, outRate)

                          cb.onProgress(100, "完成")
                          cb.onDone(result.first, result.second)
                      } catch (t: Throwable) {
                          cb.onError(t.message ?: t.toString())
                      }
                  }
              }

              private fun buildTimeline(clips: List<Clip>, durationMs: Long, outRate: Int): FloatArray {
                  val total = (durationMs * outRate / 1000L).toInt().coerceAtLeast(outRate)
                  val buf = FloatArray(total)
                  var prevEnd = 0L
                  for (c in clips.sortedBy { it.startMs }) {
                      val start = maxOf(c.startMs, prevEnd)
                      val slotMs = (c.endMs - start).coerceAtLeast(60L)
                      val startIdx = (start * outRate / 1000L).toInt()
                      if (startIdx >= total) break
                      val targetCount = (slotMs * outRate / 1000L).toInt().coerceAtLeast(1)
                      val atOut = TimeStretch.resample(c.samples, c.rate, outRate)
                      val res = TimeStretch.clipToLength(atOut, targetCount)
                      var idx = startIdx
                      var k = 0
                      while (k < res.size && idx < total) {
                          buf[idx] = res[k]
                          idx++; k++
                      }
                      prevEnd = start + slotMs
                  }
                  return buf
              }
          }
