          package com.rorykosanke.vdub

          import android.content.Context
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.util.Log
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.util.Locale
          import java.util.concurrent.ConcurrentHashMap
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit

          /**
           * 中文语音合成：
           *  1) 优先用手机系统 TTS（离线、免费、音质好）——前提是装了中文语音；
           *  2) 系统没有中文语音或合成失败时，自动改用免费的在线发音接口（有道，国内可直连、无需Key）；
           * 输出统一为：单声道 float 样本 + 采样率。
           */
          class TtsSynth(private val context: Context) {

              private var tts: TextToSpeech? = null
              private val latches = ConcurrentHashMap<String, CountDownLatch>()
              private var localReady = false

              var localCount = 0
              var onlineCount = 0
              var lastDebug = ""

              fun init() {
                  val ready = CountDownLatch(1)
                  tts = TextToSpeech(context.applicationContext) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val t = tts
                          if (t != null) {
                              val locales = listOf(Locale.SIMPLIFIED_CHINESE, Locale.CHINA, Locale.CHINESE)
                              for (loc in locales) {
                                  val r = try { t.setLanguage(loc) } catch (e: Exception) { TextToSpeech.LANG_NOT_SUPPORTED }
                                  if (r == TextToSpeech.LANG_AVAILABLE ||
                                      r == TextToSpeech.LANG_COUNTRY_AVAILABLE ||
                                      r == TextToSpeech.LANG_COUNTRY_VAR_AVAILABLE) {
                                      localReady = true
                                      break
                                  }
                              }
                              try { t.setSpeechRate(1.0f) } catch (_: Exception) {}
                              Log.i("TtsSynth", "localReady=$localReady")
                          }
                      } else {
                          Log.w("TtsSynth", "TTS init status=$status")
                      }
                      ready.countDown()
                  }
                  ready.await(15, TimeUnit.SECONDS)
                  tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(utteranceId: String?) {}
                      override fun onDone(utteranceId: String?) { latches.remove(utteranceId)?.countDown() }
                      @Deprecated("Deprecated in Java")
                      override fun onError(utteranceId: String?) { latches.remove(utteranceId)?.countDown() }
                  })
              }

              /** 返回 (单声道 float 样本, 采样率)，失败返回 null */
              fun synthesize(text: String): Pair<FloatArray, Int>? {
                  if (text.isBlank()) return null
                  if (localReady) {
                      val local = synthLocal(text)
                      if (local != null && local.first.isNotEmpty()) { localCount++; return local }
                  }
                  val online = synthOnline(text)
                  if (online != null && online.first.isNotEmpty()) { onlineCount++; return online }
                  return null
              }

              private fun synthLocal(text: String): Pair<FloatArray, Int>? {
                  val t = tts ?: return null
                  val id = "u" + System.nanoTime()
                  val file = File(context.cacheDir, "$id.wav")
                  val latch = CountDownLatch(1)
                  latches[id] = latch
                  val res = t.synthesizeToFile(text, Bundle(), file, id)
                  if (res != TextToSpeech.SUCCESS) {
                      latches.remove(id); file.delete(); lastDebug = "local res=$res"; return null
                  }
                  val ok = latch.await(30, TimeUnit.SECONDS)
                  latches.remove(id)
                  if (!ok) { file.delete(); lastDebug = "local timeout"; return null }
                  try {
                      if (!file.exists() || file.length() < 200) return null
                      val parsed = WavUtils.readMonoFloat(file)
                      if (parsed != null && parsed.first.isNotEmpty()) return parsed
                      // 若不是标准 WAV，用 MediaCodec 再解一次
                      val dec = AudioDecoder().decodeFileToMono16k(file)
                      if (dec.isNotEmpty()) return Pair(dec, 16000)
                      return null
                  } catch (e: Exception) {
                      lastDebug = "local read: ${e.message}"
                      return null
                  } finally {
                      file.delete()
                  }
              }

              private fun synthOnline(text: String): Pair<FloatArray, Int>? {
                  return try {
                      val q = URLEncoder.encode(text, "UTF-8")
                      val url = "https://dict.youdao.com/dictvoice?le=zh&audio=$q"
                      val conn = URL(url).openConnection() as HttpURLConnection
                      conn.connectTimeout = 15000
                      conn.readTimeout = 30000
                      conn.instanceFollowRedirects = true
                      conn.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android)")
                      conn.connect()
                      if (conn.responseCode !in 200..299) { conn.disconnect(); lastDebug = "online code=${conn.responseCode}"; return null }
                      val bytes = conn.inputStream.use { it.readBytes() }
                      conn.disconnect()
                      if (bytes.size < 1000) { lastDebug = "online too small ${bytes.size}"; return null }
                      val f = File(context.cacheDir, "o" + System.nanoTime() + ".mp3")
                      f.writeBytes(bytes)
                      try {
                          val pcm = AudioDecoder().decodeFileToMono16k(f)
                          if (pcm.isNotEmpty()) Pair(pcm, 16000) else { lastDebug = "online decode empty"; null }
                      } finally {
                          f.delete()
                      }
                  } catch (e: Exception) {
                      lastDebug = "online: ${e.message}"
                      null
                  }
              }

              fun release() {
                  try { tts?.stop(); tts?.shutdown() } catch (_: Exception) {}
              }
          }
