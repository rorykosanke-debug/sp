          package com.rorykosanke.vdub

          import java.io.File
          import java.nio.ByteBuffer
          import java.nio.ByteOrder

          /** 读取 TTS 生成的 WAV，转成单声道 float + 采样率 */
          object WavUtils {

              fun readMonoFloat(file: File): Pair<FloatArray, Int>? {
                  val bytes = file.readBytes()
                  if (bytes.size < 44) return null
                  val bb = ByteBuffer.wrap(bytes).order(ByteOrder.LITTLE_ENDIAN)
                  if (bytes[0] != 'R'.code.toByte() || bytes[1] != 'I'.code.toByte() ||
                      bytes[2] != 'F'.code.toByte() || bytes[3] != 'F'.code.toByte()) return null

                  var pos = 12
                  var sampleRate = 16000
                  var channels = 1
                  var bits = 16
                  var dataOffset = -1
                  var dataLen = 0

                  while (pos + 8 <= bytes.size) {
                      val id = String(bytes, pos, 4, Charsets.US_ASCII)
                      val size = bb.getInt(pos + 4)
                      val body = pos + 8
                      when (id) {
                          "fmt " -> {
                              channels = bb.getShort(body + 2).toInt()
                              sampleRate = bb.getInt(body + 4)
                              bits = bb.getShort(body + 14).toInt()
                          }
                          "data" -> {
                              dataOffset = body
                              dataLen = minOf(size, bytes.size - body)
                          }
                      }
                      if (id == "data") break
                      pos = body + size + (size and 1)
                  }
                  if (dataOffset < 0) {
                      dataOffset = 44
                      dataLen = bytes.size - 44
                  }
                  if (bits != 16 || channels < 1) return null

                  val bytesPerSample = 2
                  val frameBytes = bytesPerSample * channels
                  if (frameBytes <= 0) return null
                  val frames = dataLen / frameBytes
                  val out = FloatArray(frames)
                  var p = dataOffset
                  for (f in 0 until frames) {
                      var sum = 0f
                      for (c in 0 until channels) {
                          if (p + 1 < bytes.size) {
                              sum += bb.getShort(p) / 32768f
                          }
                          p += bytesPerSample
                      }
                      out[f] = sum / channels
                  }
                  return Pair(out, sampleRate)
              }
          }
