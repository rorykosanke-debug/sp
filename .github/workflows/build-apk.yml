          cat > app/src/main/java/com/rorykosanke/vdub/TimeStretch.kt <<'EOF_19'
          package com.rorykosanke.vdub

          /** 采样率转换 + 变速对齐时长 */
          object TimeStretch {

              /** 改变采样率：保持时长与音高（srcRate -> dstRate） */
              fun resample(input: FloatArray, srcRate: Int, dstRate: Int): FloatArray {
                  if (input.isEmpty() || srcRate <= 0 || dstRate <= 0 || srcRate == dstRate) return input
                  val outLen = (input.size.toLong() * dstRate / srcRate).toInt().coerceAtLeast(1)
                  val out = FloatArray(outLen)
                  val last = input.size - 1
                  val ratio = srcRate.toDouble() / dstRate
                  for (i in 0 until outLen) {
                      val pos = i * ratio
                      val i0 = pos.toInt().coerceIn(0, last)
                      val i1 = (i0 + 1).coerceAtMost(last)
                      val frac = (pos - i0).toFloat()
                      out[i] = input[i0] * (1 - frac) + input[i1] * frac
                  }
                  return out
              }

              /** 把任意长度的音频片段映射成目标样本数（同时实现“变速对齐时长”） */
              fun clipToLength(input: FloatArray, targetCount: Int): FloatArray {
                  if (input.isEmpty() || targetCount <= 0) return FloatArray(0)
                  if (input.size == targetCount) return input
                  val out = FloatArray(targetCount)
                  val lastSrc = input.size - 1
                  val ratio = if (targetCount > 1) lastSrc.toDouble() / (targetCount - 1) else 0.0
                  for (i in 0 until targetCount) {
                      val posd = i * ratio
                      val i0 = posd.toInt().coerceIn(0, lastSrc)
                      val i1 = (i0 + 1).coerceAtMost(lastSrc)
                      val frac = (posd - i0).toFloat()
                      out[i] = input[i0] * (1 - frac) + input[i1] * frac
                  }
                  return out
              }
          }
