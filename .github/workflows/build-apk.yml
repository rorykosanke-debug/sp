name: Build Vidub APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install SDK / NDK / CMake
        run: |
          set -x
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager => $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" || { echo "SDK/NDK 安装失败"; exit 1; }

      - name: Install Gradle 8.4
        run: |
          cd /tmp
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt
          echo "/opt/gradle-8.4/bin" >> "$GITHUB_PATH"

      - name: Generate project files
        run: |
          set -e
          mkdir -p app/src/main/java/com/rorykosanke/vdub
          mkdir -p app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/cpp

          cat > settings.gradle <<'EOF_1'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Vidub"
          include ':app'
          EOF_1

          cat > build.gradle <<'EOF_2'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF_2

          cat > gradle.properties <<'EOF_3'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF_3

          cat > app/build.gradle <<'EOF_4'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.rorykosanke.vdub'
              compileSdk 34
              ndkVersion '26.1.10909125'

              defaultConfig {
                  applicationId 'com.rorykosanke.vdub'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  ndk { abiFilters 'arm64-v8a' }
                  externalNativeBuild {
                      cmake {
                          arguments "-DANDROID_STL=c++_shared",
                                    "-DWHISPER_BUILD_EXAMPLES=OFF",
                                    "-DWHISPER_BUILD_TESTS=OFF",
                                    "-DWHISPER_BUILD_SERVER=OFF",
                                    "-DGGML_BUILD_TESTS=OFF",
                                    "-DGGML_BUILD_EXAMPLES=OFF",
                                    "-DGGML_OPENMP=OFF",
                                    "-DGGML_NATIVE=OFF"
                          cppFlags "-std=c++17 -O2"
                      }
                  }
              }

              signingConfigs {
                  release {
                      storeFile file("../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              externalNativeBuild {
                  cmake {
                      path "src/main/cpp/CMakeLists.txt"
                      version "3.22.1"
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
          }
          EOF_4

          cat > app/src/main/AndroidManifest.xml <<'EOF_5'
